<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ivan ❤️ Eunice | Our Moments</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f8f9fa; --accent: #6366f1; --glass: rgba(255, 255, 255, 0.85); --text: #1f2937; --danger: #ef4444; }
        
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%); 
            background-attachment: fixed; 
            color: var(--text); 
            margin: 0; 
            padding: 10px 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            overflow-x: hidden; 
        }

        /* Buttons & UI Components */
        .admin-login-btn { position: absolute; top: 15px; left: 15px; background: var(--glass); border: 1px solid rgba(255,255,255,0.5); padding: 8px 16px; border-radius: 12px; font-size: 11px; font-weight: 500; cursor: pointer; backdrop-filter: blur(10px); z-index: 1000; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        #fab { display: none; position: fixed; bottom: 25px; right: 25px; width: 56px; height: 56px; background: var(--accent); color: white; border-radius: 50%; border: none; font-size: 24px; cursor: pointer; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); z-index: 2000; align-items: center; justify-content: center; }
        
        /* Status Bar */
        .couple-status { position: sticky; top: 10px; align-self: flex-end; background: var(--glass); backdrop-filter: blur(12px); border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); z-index: 100; margin: 5px 0 10px 0; padding: 8px 14px; }
        .couple-status .names { font-weight: 600; font-size: 13px; color: var(--accent); }
        .couple-status .monthsary { font-size: 10px; color: #6b7280; text-transform: uppercase; }

        /* Overlays & Cards */
        #loginOverlay, #uploadOverlay, #actionModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); z-index: 5000; align-items: center; justify-content: center; }
        .login-card, .upload-card, .modal-content { background: white; padding: 30px; border-radius: 28px; width: 90%; max-width: 320px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        
        /* Inputs */
        .login-input, textarea { width: 100%; padding: 14px; border: 1px solid #e5e7eb; border-radius: 14px; font-family: 'Poppins'; box-sizing: border-box; margin-bottom: 15px; outline: none; }
        .btn-upload, .login-submit { width: 100%; background: var(--accent); color: white; border: none; padding: 14px; border-radius: 14px; font-weight: 600; cursor: pointer; }
        
        /* Gallery Grid */
        #gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 1200px; }
        .memory-card { border-radius: 20px; overflow: hidden; transition: 0.3s; box-shadow: 0 0 25px rgba(0, 0, 0, 0.08); background: white; }
        .memory-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
        
        /* Toast */
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1f2937; color: white; padding: 10px 20px; border-radius: 50px; z-index: 6000; transition: 0.3s; }
        #toast.show { transform: translateX(-50%) translateY(0); }

        @media (max-width: 768px) { #gallery { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) { #gallery { grid-template-columns: repeat(1, 1fr); } }

        @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.6; }
    100% { opacity: 1; }
}
.btn-upload:disabled {
    animation: pulse 1.5s infinite;
    cursor: not-allowed;
    background: #9ca3af;
}
    </style>
</head>
<body>

    <button class="admin-login-btn" id="lockBtn" onclick="toggleAuth()">Log in</button>
    <button id="fab" onclick="document.getElementById('uploadOverlay').style.display='flex'">+</button>

    <div class="couple-status" id="coupleStatus">
        <div class="names">Ivan & Eunice</div>
        <div id="monthsaryDisplay" class="monthsary">Calculating...</div>
    </div>

    <header>
        <h1>Our Moments</h1>
        <p class="subtitle">Let's cherish our moments together baby.</p>
    </header>

    <div id="gallery"></div>

    <div id="loginOverlay" onclick="closeAuth()">
        <div class="login-card" onclick="event.stopPropagation()">
            <h2>Welcome Back</h2>
            <p>Enter the code to unlock our gallery studio.</p>
            <input type="password" id="adminPass" class="login-input" placeholder="Secret Code">
            <button class="login-submit" onclick="verifyPass()">Enter Studio</button>
        </div>
    </div>

    <div id="uploadOverlay" onclick="this.style.display='none'">
        <div class="upload-card" id="uploadSection" onclick="event.stopPropagation()">
            <div class="file-input-container" style="border: 2px dashed #eee; padding: 20px; border-radius: 15px; margin-bottom: 15px;" onclick="document.getElementById('imageInput').click()">
                <label class="custom-file-upload">Choose a Photo</label>
                <input type="file" id="imageInput" accept="image/*" onchange="updateFileName()">
                <p id="fileNameDisplay" style="font-size: 11px; color: #9ca3af; margin-top: 8px;">No file selected</p>
            </div>
            <textarea id="captionInput" placeholder="Write something sweet..."></textarea>
            <div style="margin-bottom: 15px;">
                <label style="font-size: 12px; color: #6b7280;">Card Color: </label>
                <input type="color" id="postColorPicker" value="#ffffff">
            </div>
            <button class="btn-upload" onclick="addMemory()">Post Moment</button>
        </div>
    </div>

    <div id="actionModal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div id="menuView">
                <button class="modal-btn" onclick="showEditView()">Edit Caption</button>
                <button class="modal-btn" style="color: red;" onclick="showConfirmDelete()">Delete Moment</button>
            </div>
            <div id="editView" style="display:none;">
                <textarea id="editCaptionInput"></textarea>
                <input type="color" id="cardColorPicker">
                <button class="modal-btn" onclick="triggerEdit()">Save Changes</button>
                <button class="modal-btn" onclick="showMenuView()">Back</button>
            </div>
            <div id="deleteView" style="display:none;">
                <p>Are you sure?</p>
                <button class="modal-btn" style="color: red;" onclick="triggerDelete()">Yes, Delete</button>
                <button class="modal-btn" onclick="showMenuView()">Cancel</button>
            </div>
        </div>
    </div>

    <div id="toast">Message here</div>

    <script>
        // --- CONFIGURATION ---
        const config = {
            repo: "velcss/ourmemories-", 
            jsonPath: "memories.json"
        };

        let isAdmin = false;
        let memories = [];
        let currentActiveId = null;

        const gallery = document.getElementById('gallery');
        const modal = document.getElementById('actionModal');

        // --- INITIALIZATION ---
        window.onload = async () => {
            const savedToken = localStorage.getItem('gh_token');
            if (savedToken) applyLoginState(true);
            updateMonthsaryCountdown();
            await loadMemories();
        };

        async function loadMemories() {
            try {
                const resp = await fetch(`https://raw.githubusercontent.com/${config.repo}/main/${config.jsonPath}?t=${Date.now()}`);
                if (resp.ok) {
                    memories = await resp.json();
                    refreshGallery();
                }
            } catch (e) { showToast("Database error ❌"); }
        }

        // --- AUTHENTICATION ---
        function verifyPass() {
            const tokenInput = document.getElementById('adminPass').value.trim();
            if (tokenInput.startsWith("ghp_") || tokenInput.startsWith("github_pat_")) {
                localStorage.setItem('gh_token', tokenInput);
                applyLoginState(true);
                location.reload(); 
            } else { showToast("Invalid Token! ❌"); }
        }

        function applyLoginState(loggedIn) {
            isAdmin = loggedIn;
            document.getElementById('fab').style.display = loggedIn ? 'flex' : 'none';
            document.getElementById('lockBtn').innerText = loggedIn ? "Log out" : "Log in";
            if (!loggedIn) localStorage.removeItem('gh_token');
        }

        function toggleAuth() {
            if (isAdmin) { applyLoginState(false); location.reload(); }
            else { document.getElementById('loginOverlay').style.display = 'flex'; }
        }

        function closeAuth() { document.getElementById('loginOverlay').style.display = 'none'; }

        // --- GITHUB API HELPERS ---
        async function githubFetch(path, message, content, sha = null) {
            const token = localStorage.getItem('gh_token');
            const body = { message, content };
            if (sha) body.sha = sha;

            return fetch(`https://api.github.com/repos/${config.repo}/contents/${path}`, {
                method: "PUT",
                headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });
        }

        async function getFileDetails(path) {
            const token = localStorage.getItem('gh_token');
            const resp = await fetch(`https://api.github.com/repos/${config.repo}/contents/${path}`, {
                headers: { "Authorization": `token ${token}` }
            });
            return resp.ok ? await resp.json() : null;
        }

        // --- CORE ACTIONS ---
        async function addMemory() {
            const file = document.getElementById('imageInput').files[0];
            const caption = document.getElementById('captionInput').value.trim();
            const bgColor = document.getElementById('postColorPicker').value;
            const btn = document.querySelector('.btn-upload');

            if (!file) return showToast("Pick a photo! 📸");
            btn.disabled = true; btn.innerText = "Processing...";

            try {
                const base64 = await compressImage(file);
                const fileName = `images/img_${Date.now()}.jpg`;
                showToast("Sending to cloud... ☁️");

                const [imgResp, jsonFile] = await Promise.all([
                    githubFetch(fileName, "Upload Photo", base64),
                    getFileDetails(config.jsonPath)
                ]);

                const newEntry = { id: Date.now(), image: `https://api.github.com/repos/${config.repo}/contents/${fileName}`, caption, bgColor, timestamp: Date.now() };
                memories.push(newEntry);

                await githubFetch(config.jsonPath, "Add Memory", btoa(unescape(encodeURIComponent(JSON.stringify(memories, null, 2)))), jsonFile?.sha);
                location.reload();
            } catch (e) { showToast("Upload failed ❌"); btn.disabled = false; }
        }

        async function triggerDelete() {
            const jsonFile = await getFileDetails(config.jsonPath);
            memories = memories.filter(m => m.id !== currentActiveId);
            await githubFetch(config.jsonPath, "Delete Memory", btoa(JSON.stringify(memories, null, 2)), jsonFile?.sha);
            location.reload();
        }

        async function triggerEdit() {
            const idx = memories.findIndex(m => m.id === currentActiveId);
            memories[idx].caption = document.getElementById('editCaptionInput').value;
            memories[idx].bgColor = document.getElementById('cardColorPicker').value;
            const jsonFile = await getFileDetails(config.jsonPath);
            await githubFetch(config.jsonPath, "Edit Memory", btoa(JSON.stringify(memories, null, 2)), jsonFile?.sha);
            location.reload();
        }

        // --- UI HELPERS ---
        function refreshGallery() {
            gallery.innerHTML = "";
            const sorted = [...memories].sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            sorted.forEach(m => renderCard(m));
        }

        async function renderCard(m) {
            const div = document.createElement('div');
            div.className = 'memory-card';
            div.style.backgroundColor = m.bgColor || "#ffffff";
            div.style.color = getContrastYIQ(m.bgColor || "#ffffff");
            div.onclick = () => { if(isAdmin) openActionMenu(m.id); };

            const imgEl = document.createElement('img');
            imgEl.src = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"; // placeholder

            const token = localStorage.getItem('gh_token');
            if (token) {
                fetch(m.image, { headers: { "Authorization": `token ${token}` }})
                    .then(r => r.json()).then(data => imgEl.src = `data:image/jpeg;base64,${data.content}`);
            }

            div.innerHTML = `<div class="content" style="padding:10px;"><p>${m.caption || ''}</p><small style="opacity:0.6">${formatTimeAgo(m.timestamp)}</small></div>`;
            div.prepend(imgEl);
            gallery.appendChild(div);
        }

        // --- UTILITIES ---
        async function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1200;
                        let w = img.width, h = img.height;
                        if (w > MAX_WIDTH) { h *= MAX_WIDTH / w; w = MAX_WIDTH; }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.7).split(',')[1]);
                    };
                };
            });
        }

        function formatTimeAgo(t) {
            const s = Math.floor((new Date() - new Date(parseInt(t))) / 1000);
            if (s < 60) return 'Just now';
            if (s < 3600) return Math.floor(s/60) + 'm ago';
            if (s < 86400) return Math.floor(s/3600) + 'h ago';
            return new Date(parseInt(t)).toLocaleDateString();
        }

        function getContrastYIQ(hex){
            hex = hex.replace("#", "");
            const r = parseInt(hex.substr(0,2),16), g = parseInt(hex.substr(2,2),16), b = parseInt(hex.substr(4,2),16);
            return ((r*299)+(g*587)+(b*114))/1000 >= 128 ? '#1f2937' : '#ffffff';
        }

        function openActionMenu(id) { currentActiveId = id; document.getElementById('actionModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('actionModal').style.display = 'none'; }
        function showEditView() { document.getElementById('menuView').style.display = 'none'; document.getElementById('editView').style.display = 'block'; }
        function showMenuView() { document.getElementById('editView').style.display = 'none'; document.getElementById('deleteView').style.display = 'none'; document.getElementById('menuView').style.display = 'block'; }
        function showConfirmDelete() { document.getElementById('menuView').style.display = 'none'; document.getElementById('deleteView').style.display = 'block'; }
        function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
        function updateFileName() { const f = document.getElementById('imageInput').files[0]; if(f) document.getElementById('fileNameDisplay').innerText = f.name; }
        function updateMonthsaryCountdown() {
            const display = document.getElementById('monthsaryDisplay');
            const now = new Date();
            let target = new Date(now.getFullYear(), now.getMonth(), 8);
            if (now.getDate() === 8) { display.innerHTML = "❤️ Happy Monthsary! ❤️"; return; }
            if (now > target) target = new Date(now.getFullYear(), now.getMonth() + 1, 8);
            display.innerHTML = `${Math.ceil((target - now) / 86400000)} Days until Monthsary`;
        }
    </script>
</body>
</html>
