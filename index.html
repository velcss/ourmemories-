<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ivan ❤️ Eunice | Our Moments</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8f9fa;
            --accent: #6366f1;
            --glass: rgba(255, 255, 255, 0.85);
            --text: #1f2937;
            --danger: #ef4444;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
            background-attachment: fixed;
            color: var(--text);
            margin: 0;
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* --- MODERN LOGIN TRIGGER --- */
        .admin-login-btn {
            font-family: 'Poppins', sans-serif;
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.5);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(10px);
            z-index: 1000;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* --- MODERN LOGIN MODAL --- */
        #loginOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            z-index: 5000;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 28px;
            width: 90%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .login-card h2 { margin: 0 0 10px 0; font-size: 1.2rem; }
        .login-card p { font-size: 12px; color: #6b7280; margin-bottom: 20px; }

        .login-input {
            width: 100%;
            padding: 14px;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            font-family: 'Poppins';
            text-align: center;
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        .login-input:focus { border-color: var(--accent); }

        .login-submit {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* --- COUPLE STATUS --- */
        .couple-status {
            position: sticky;
            top: 10px;
            align-self: flex-end;
            background: var(--glass);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            z-index: 100;
            margin: 5px 0 10px 0;
            padding: 8px 14px;
            transition: opacity 0.3s ease;
        }
        .couple-status .names { font-weight: 600; font-size: 13px; color: var(--accent); }
        .couple-status .monthsary { font-size: 10px; color: #6b7280; text-transform: uppercase; }

        header { text-align: center; margin-bottom: 15px; width: 100%; }
        h1 { font-weight: 600; margin: 5px 0 0 0; font-size: 1.8rem; }
        .subtitle { color: #6b7280; font-weight: 300; font-size: 0.9rem; margin-top: 2px; }

        /* --- FLOATING UPLOAD UI --- */
        #fab {
            display: none; 
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 56px;
            height: 56px;
            background: var(--accent);
            color: white;
            border-radius: 50%;
            border: none;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        #uploadOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            z-index: 4000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #uploadSection {
            display: block;
            background: white;
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
            padding: 18px;
        }

        .file-input-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            border: 2px dashed #e5e7eb;
            border-radius: 18px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.4);
            cursor: pointer;
        }

        input[type="file"] { display: none; }
        .custom-file-upload { background: white; padding: 8px 16px; border-radius: 10px; font-size: 13px; border: 1px solid #d1d5db; }

        textarea {
            width: 100%; height: 80px; padding: 12px; border: 1px solid #e5e7eb; border-radius: 12px;
            resize: none; box-sizing: border-box; font-family: 'Poppins', sans-serif; margin-bottom: 15px;
        }

        .btn-upload { width: 100%; background: var(--accent); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 600; cursor: pointer; }

        /* --- UPDATED 3 ROW MOBILE GRID --- */
        #gallery { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; 
            width: 100%; 
            max-width: 1200px; 
        }

        .memory-card { border-radius: 20px; overflow: hidden; transition: 0.3s; box-shadow: 0 0 25px rgba(0, 0, 0, 0.08); }
        .memory-card img { width: 100%; height: auto; display: block; aspect-ratio: 1/1; object-fit: cover; }
        
        /* --- FIXED CAPTION TEXT SIZE --- */
        .caption-text { 
            font-size: 11px; /* Mobile size */
            line-height: 1.4; margin: 0;
            white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word;
        }
        
        /* DESKTOP ADJUSTMENTS */
        @media (min-width: 1000px) { 
            #gallery { grid-template-columns: repeat(3, 1fr); gap: 20px; } 
            .caption-text { font-size: 15px; } /* Increased for desktop */
            .memory-card .content { padding: 15px !important; }
            .time-ago { font-size: 10px !important; }
            .see-more-btn { font-size: 12px !important; }
        }

        .caption-text.collapsed { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .see-more-btn { background: none; border: none; padding: 0; margin-top: 4px; font-size: 9px; font-weight: 600; cursor: pointer; color: inherit; opacity: 0.8; }

        #actionModal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(6px);
            z-index: 2000; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-content { background: white; padding: 25px; border-radius: 24px; width: 100%; max-width: 320px; text-align: center; }
        .modal-btn { width: 100%; padding: 12px; margin: 6px 0; border: none; border-radius: 12px; font-family: 'Poppins'; cursor: pointer; }

        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: #1f2937; color: white; padding: 10px 20px; border-radius: 50px; z-index: 6000; transition: 0.3s;
        }

        #toast.show { transform: translateX(-50%) translateY(0); }

        .color-picker-wrapper { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 20px; }
        .color-label { font-size: 13px; font-weight: 500; color: #6b7280; }
        .modern-picker-container { position: relative; width: 60px; height: 32px; border-radius: 20px; border: 2px solid #e5e7eb; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
        #cardColorPicker { position: absolute; top: -10px; left: -10px; width: 100px; height: 100px; cursor: pointer; opacity: 0; }
        .color-preview-bar { width: 100%; height: 100%; pointer-events: none; }
        #editCaptionInput { width: 100%; height: 100px; padding: 15px; border: 1px solid #eef0f2; border-radius: 18px; background: #fcfcfd; font-family: 'Poppins', sans-serif; font-size: 14px; resize: none; box-sizing: border-box; margin-bottom: 20px; outline: none; transition: border-color 0.3s; }
        .save-changes-btn { background: #7371fc !important; color: white !important; font-weight: 500 !important; box-shadow: 0 4px 12px rgba(115, 113, 252, 0.3); }
        .back-btn { background: #e9ecef !important; color: #1f2937 !important; font-weight: 500 !important; }
    </style>
</head>
<body>

<button class="admin-login-btn" id="lockBtn" onclick="toggleAuth()">Log in</button>

<button id="fab" onclick="document.getElementById('uploadOverlay').style.display='flex'">+</button>

<div id="loginOverlay" onclick="closeAuth()">
    <div class="login-card" onclick="event.stopPropagation()">
        <h2>Welcome Back</h2>
        <p>Please enter our secret code to unlock the gallery studio.</p>
        <input type="password" id="adminPass" class="login-input" placeholder="Secret Code">
        <button class="login-submit" onclick="verifyPass()">Enter Studio</button>
    </div>
</div>

<div class="couple-status" id="coupleStatus">
    <div class="names">Ivan & Eunice</div>
    <div id="monthsaryDisplay" class="monthsary">Calculating...</div>
</div>

<header>
    <h1>Our Moments</h1>
    <p class="subtitle">Let's cherish our moments together baby.</p>
</header>

<div id="uploadOverlay" onclick="this.style.display='none'">
    <div class="upload-card" id="uploadSection" onclick="event.stopPropagation()">
        <div class="file-input-container" onclick="document.getElementById('imageInput').click()">
            <label class="custom-file-upload">Choose a Photo</label>
            <input type="file" id="imageInput" accept="image/*" onchange="updateFileName()">
            <p id="fileNameDisplay" style="font-size: 11px; color: #9ca3af; margin-top: 8px;">No file selected</p>
        </div>
        <textarea id="captionInput" placeholder="Write something sweet..."></textarea>
        <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px;">
            <label style="font-size: 12px; color: #6b7280;">Card Color:</label>
            <input type="color" id="postColorPicker" value="#ffffff">
        </div>
        <button class="btn-upload" onclick="addMemory()">Post Moment</button>
    </div>
</div>

<div id="gallery"></div>

<div id="actionModal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()" style="padding: 35px 25px;">
        <div id="menuView">
            <h3 style="margin-top:0; font-weight: 600;">Manage Moment</h3>
            <button class="modal-btn" style="background:#f3f4f6;" onclick="showEditView()">Edit & Customize</button>
            <button class="modal-btn" style="background:#fee2e2; color:var(--danger);" onclick="showConfirmDelete()">Delete</button>
            <button class="modal-btn" style="background: transparent; color: #9ca3af;" onclick="closeModal()">Cancel</button>
        </div>
        <div id="editView" style="display: none;">
            <h3 style="margin-top:0; font-weight: 600; margin-bottom: 20px;">Customize Card</h3>
            <div class="color-picker-wrapper">
                <span class="color-label">Card Color:</span>
                <div class="modern-picker-container">
                    <div id="colorIndicator" class="color-preview-bar"></div>
                    <input type="color" id="cardColorPicker" oninput="updateColorIndicator(this.value)">
                </div>
            </div>
            <textarea id="editCaptionInput" placeholder="Write caption"></textarea>
            <button class="modal-btn save-changes-btn" onclick="triggerEdit()">Save Changes</button>
            <button class="modal-btn back-btn" onclick="showMenuView()">Back</button>
        </div>
        <div id="deleteView" style="display: none;">
            <h3 style="margin-top:0; color: var(--danger)">Delete?</h3>
            <p style="font-size: 13px; color: #6b7280;">This action cannot be undone.</p>
            <button class="modal-btn" style="background:var(--danger); color:white;" onclick="triggerDelete()">Yes, Delete</button>
            <button class="modal-btn back-btn" onclick="showMenuView()">Cancel</button>
        </div>
    </div>
</div>

<div id="toast">Message here</div>

<script>
    let isAdmin = false; 
    const gallery = document.getElementById('gallery');
    const modal = document.getElementById('actionModal');
    const loginOverlay = document.getElementById('loginOverlay');
    const fab = document.getElementById('fab');
    const coupleStatus = document.getElementById('coupleStatus');
    let currentActiveId = null;

    window.addEventListener('scroll', () => {
        if (window.scrollY > 10) {
            coupleStatus.style.opacity = '0';
        } else {
            coupleStatus.style.opacity = '1';
        }
    });

    window.onload = () => {
        const sessionActive = localStorage.getItem('adminSession');
        if (sessionActive === 'true') {
            applyLoginState(true);
        }
        const saved = JSON.parse(localStorage.getItem('memories')) || [];
        saved.reverse().forEach(m => renderCard(m.id, m.image, m.caption, m.bgColor || '#ffffff', m.timestamp || m.id));
        updateMonthsaryCountdown();
    };

    function applyLoginState(loggedIn) {
        isAdmin = loggedIn;
        const lockBtn = document.getElementById('lockBtn');
        if (loggedIn) {
            fab.style.display = 'flex';
            lockBtn.innerText = "Log out";
            localStorage.setItem('adminSession', 'true');
        } else {
            fab.style.display = 'none';
            lockBtn.innerText = "Log in";
            localStorage.removeItem('adminSession');
        }
        refreshGallery();
    }

    function verifyPass() {
        const passwordInput = document.getElementById('adminPass');
        if (passwordInput.value === "682025") {
            applyLoginState(true);
            closeAuth(); 
            passwordInput.value = '';
            showToast("Welcome Back! ❤️");
        } else {
            showToast("Incorrect Code ❌");
        }
    }

    function toggleAuth() {
        if (isAdmin) {
            applyLoginState(false);
            showToast("Logged out 🔒");
        } else {
            loginOverlay.style.display = 'flex';
            document.getElementById('adminPass').focus();
        }
    }

    function closeAuth() { loginOverlay.style.display = 'none'; }

    function refreshGallery() {
        gallery.innerHTML = "";
        const saved = JSON.parse(localStorage.getItem('memories')) || [];
        saved.reverse().forEach(m => renderCard(m.id, m.image, m.caption, m.bgColor || '#ffffff', m.timestamp || m.id));
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg; toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function updateMonthsaryCountdown() {
        const display = document.getElementById('monthsaryDisplay');
        const now = new Date();
        let target = new Date(now.getFullYear(), now.getMonth(), 8);
        if (now.getDate() === 8) { display.innerHTML = "❤️ Happy Monthsary! ❤️"; return; }
        if (now > target) target = new Date(now.getFullYear(), now.getMonth() + 1, 8);
        display.innerHTML = `${Math.ceil((target - now) / 86400000)} Days until Monthsary`;
    }

    function getContrastYIQ(hexcolor){
        hexcolor = hexcolor.replace("#", "");
        var r = parseInt(hexcolor.substr(0,2),16);
        var g = parseInt(hexcolor.substr(2,2),16);
        var b = parseInt(hexcolor.substr(4,2),16);
        var yiq = ((r*299)+(g*587)+(b*114))/1000;
        return (yiq >= 128) ? '#1f2937' : '#ffffff';
    }

    function addMemory() {
        const file = document.getElementById('imageInput').files[0];
        const chosenColor = document.getElementById('postColorPicker').value;
        const caption = document.getElementById('captionInput').value.trim(); 
        if (!file) return showToast("Pick a photo! 📸");
        const reader = new FileReader();
        reader.onload = (e) => {
            const id = Date.now();
            renderCard(id, e.target.result, caption, chosenColor, id);
            saveMemory(id, e.target.result, caption, chosenColor, id);
            document.getElementById('imageInput').value = ''; 
            document.getElementById('captionInput').value = '';
            document.getElementById('fileNameDisplay').textContent = "No file selected";
            document.getElementById('uploadOverlay').style.display='none';
            showToast("Posted! ✨");
        };
        reader.readAsDataURL(file);
    }

    function renderCard(id, image, caption, bgColor, timestamp) {
        const div = document.createElement('div');
        const textColor = getContrastYIQ(bgColor);
        div.className = `memory-card`;
        div.id = `mem-${id}`;
        div.style.backgroundColor = bgColor;
        div.style.color = textColor;
        div.style.cursor = isAdmin ? 'pointer' : 'default';
        const hasCaption = caption && caption.trim().length > 0;
        const isLong = hasCaption && caption.length > 50;
        const captionHtml = hasCaption ? `
            <p class="caption-text ${isLong ? 'collapsed' : ''}" id="cap-${id}" style="color: inherit;">${caption}</p>
            ${isLong ? `<button class="see-more-btn" onclick="toggleCaption(event, ${id})">See more</button>` : ""}
        ` : "";
        div.onclick = () => { if(isAdmin) openActionMenu(id); };
        div.innerHTML = `
            <img src="${image}">
            <div class="content" style="display: flex; flex-direction: column; padding: 8px;">
                ${captionHtml}
                <p class="time-ago" data-time="${timestamp}" style="font-size: 8px; opacity: 0.7; align-self: flex-end; margin-top: 5px;"></p>
            </div>
        `;
        gallery.prepend(div);
        updateTimeLabels();
    }

    function saveMemory(id, image, caption, bgColor, timestamp) {
        const mems = JSON.parse(localStorage.getItem('memories')) || [];
        mems.push({ id, image, caption, bgColor, timestamp }); 
        localStorage.setItem('memories', JSON.stringify(mems));
    }

    function triggerEdit() {
        let mems = JSON.parse(localStorage.getItem('memories'));
        const idx = mems.findIndex(m => m.id === currentActiveId);
        mems[idx].caption = document.getElementById('editCaptionInput').value.trim();
        mems[idx].bgColor = document.getElementById('cardColorPicker').value;
        localStorage.setItem('memories', JSON.stringify(mems));
        refreshGallery();
        closeModal();
    }

    function openActionMenu(id) { 
        currentActiveId = id; 
        document.getElementById('menuView').style.display = 'block';
        document.getElementById('editView').style.display = 'none';
        document.getElementById('deleteView').style.display = 'none';
        modal.style.display = 'flex'; 
    }
    function showEditView() {
        const mems = JSON.parse(localStorage.getItem('memories'));
        const m = mems.find(m => m.id === currentActiveId);
        document.getElementById('editCaptionInput').value = m.caption || "";
        document.getElementById('cardColorPicker').value = m.bgColor || "#ffffff";
        updateColorIndicator(m.bgColor || "#ffffff");
        document.getElementById('menuView').style.display = 'none'; 
        document.getElementById('editView').style.display = 'block';
    }
    function showMenuView() { document.getElementById('editView').style.display = 'none'; document.getElementById('deleteView').style.display = 'none'; document.getElementById('menuView').style.display = 'block'; }
    function closeModal() { modal.style.display = 'none'; }
    function showConfirmDelete() { document.getElementById('menuView').style.display = 'none'; document.getElementById('deleteView').style.display = 'block'; }
    function triggerDelete() {
        let mems = JSON.parse(localStorage.getItem('memories')).filter(m => m.id !== currentActiveId);
        localStorage.setItem('memories', JSON.stringify(mems));
        refreshGallery();
        closeModal();
    }
    function formatTimeAgo(timestamp) {
        const seconds = Math.floor((new Date() - new Date(parseInt(timestamp))) / 1000);
        if (seconds < 60) return 'now';
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return minutes + 'm';
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return hours + 'h';
        return new Date(parseInt(timestamp)).toLocaleDateString();
    }
    function updateTimeLabels() {
        document.querySelectorAll('.time-ago').forEach(el => {
            const t = el.getAttribute('data-time');
            if (t) el.innerText = formatTimeAgo(t);
        });
    }
    function toggleCaption(e, id) {
        e.stopPropagation();
        const cap = document.getElementById(`cap-${id}`);
        cap.classList.toggle('collapsed');
        e.target.innerText = cap.classList.contains('collapsed') ? "See more" : "See less";
    }
    function updateFileName() {
        const f = document.getElementById('imageInput').files[0];
        if (f) document.getElementById('fileNameDisplay').textContent = "Selected: " + f.name;
    }
    function updateColorIndicator(val) { document.getElementById('colorIndicator').style.backgroundColor = val; }
    document.getElementById('adminPass').addEventListener('keypress', (e) => { if (e.key === 'Enter') verifyPass(); });
    setInterval(updateTimeLabels, 60000);
</script>
</body>
</html>
