<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moments | Creative Gallery</title>

  <link rel="stylesheet" href="ivan.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html {
      scroll-behavior: smooth;
    }
  </style>
</head>

<body class="font-['Poppins'] bg-gradient-to-b from-white to-rose-100 text-white p-0 m-0">

  <!-- MODERN RESPONSIVE NAVBAR -->
  <div class="flex flex-wrap justify-center gap-4 mt-10 font-semibold px-4">
    <a href="#memories"
       class="px-4 py-2 rounded-full bg-purple-500/20 text-purple-500 hover:bg-purple-500 hover:text-white transition-all duration-300 text-sm sm:text-base">
      Memories
    </a>
    <a href="#music"
       class="px-4 py-2 rounded-full bg-purple-500/20 text-purple-500 hover:bg-purple-500 hover:text-white transition-all duration-300 text-sm sm:text-base">
      Music
    </a>
    <a href="#info"
       class="px-4 py-2 rounded-full bg-purple-500/20 text-purple-500 hover:bg-purple-500 hover:text-white transition-all duration-300 text-sm sm:text-base">
      Info
    </a>
  </div>

  <!-- MEMORIES SECTION -->
  <p id="memories" class="text-purple-500 font-semibold text-3xl sm:text-4xl text-center pt-10 px-4">
    Our memories
  </p>

  <!-- IMAGE SLIDER -->
  <div class="relative max-w-full sm:max-w-xl mx-auto mt-8 shadow drop-shadow-2xl px-4">
    <img id="sliderImage" src="images/slide1.jpg"
         class="w-full h-[200px] sm:h-[400px] md:h-[450px] object-cover rounded-2xl shadow-lg transition-all duration-300 ease-in-out opacity-100"
         alt="Memory">
    <button onclick="prevImage()"
            class="absolute top-1/2 left-2 sm:left-4 -translate-y-1/2 bg-black/60 hover:bg-purple-500 px-3 sm:px-4 py-1 sm:py-2 rounded-full text-sm sm:text-base">
      ❮
    </button>
    <button onclick="nextImage()"
            class="absolute top-1/2 right-2 sm:right-4 -translate-y-1/2 bg-black/60 hover:bg-purple-500 px-3 sm:px-4 py-1 sm:py-2 rounded-full text-sm sm:text-base">
      ❯
    </button>
  </div>

  <hr class="border-gray-400 my-20 sm:my-32 w-3/4 sm:w-2/4 mx-auto">

  <!-- MUSIC SECTION -->
  <div id="music" class="max-w-full sm:max-w-xl mx-auto mt-10 aspect-video drop-shadow-xl px-4">
    <p class="text-purple-500 font-semibold text-3xl sm:text-5xl text-center mb-6 sm:mb-10">
      Favorite music
    </p>
    <iframe class="w-full h-full rounded-xl"
            src="https://www.youtube.com/embed/r27t3H36jmU"
            allow="autoplay"
            title="YouTube video player"
            frameborder="0"
            allowfullscreen>
    </iframe>
  </div>

  <hr class="border-gray-400 my-20 sm:my-32 w-3/4 sm:w-2/4 mx-auto">

  <!-- INFO SECTION -->
  <div id="info" class="max-w-full sm:max-w-xl mx-auto mt-10 text-center px-4">
    <p class="text-purple-500 font-semibold text-2xl sm:text-4xl">Info</p>
    <p class="mt-4 text-white text-sm sm:text-base">
      This is your info section.
    </p>
  </div>


  <!-- BACK TO TOP BUTTON -->
<button id="backToTop"
        class="fixed bottom-6 right-6 bg-purple-500 text-white w-12 h-12 flex items-center justify-center rounded-full shadow-lg hover:bg-purple-600 hover:scale-110 transition-all duration-300 opacity-0 pointer-events-none z-50">
  ↑
</button>


  <!-- SLIDER SCRIPT -->
  <script>
    const images = [
      "images/slide1.jpg",
      "images/slide2.jpg",
      "images/slide3.jpg"
    ];

    let currentIndex = 0;
    const sliderImage = document.getElementById("sliderImage");

    function animateChange(newIndex, direction = 1) {
      // fade out + slide
      sliderImage.classList.remove("opacity-100", "translate-x-0");
      sliderImage.classList.add(
        "opacity-0",
        direction === 1 ? "translate-x-4" : "-translate-x-4"
      );

      setTimeout(() => {
        currentIndex = newIndex;
        sliderImage.src = images[currentIndex];

        // reset position instantly
        sliderImage.classList.remove("translate-x-4", "-translate-x-4");
        sliderImage.classList.add("translate-x-0");

        // fade back in
        sliderImage.classList.remove("opacity-0");
        sliderImage.classList.add("opacity-100");
      }, 200);
    }

    function nextImage() {
      const next = (currentIndex + 1) % images.length;
      animateChange(next, 1);
    }

    function prevImage() {
      const prev = (currentIndex - 1 + images.length) % images.length;
      animateChange(prev, -1);
    }

    // BACK TO TOP BUTTON SCRIPT
    const backToTop = document.getElementById("backToTop");

    window.addEventListener("scroll", () => {
      if (window.scrollY > 200) {
        backToTop.classList.remove("opacity-0", "pointer-events-none");
        backToTop.classList.add("opacity-100");
      } else {
        backToTop.classList.remove("opacity-100");
        backToTop.classList.add("opacity-0", "pointer-events-none");
      }
    });

    backToTop.addEventListener("click", () => {
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });
  </script>

</body>
</html>
